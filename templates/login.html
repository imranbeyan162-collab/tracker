<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Verification - Imran & Mikiyas Management</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    :root {
      --bg-primary: #0b0f17;
      --bg-secondary: #111827;
      --bg-card: #141d2e;
      --border-color: #1e293b;
      --border-focus: #6366f1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --accent-indigo: #6366f1;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #151f32 0%, #080c14 100%);
      color: #f8fafc;
      padding: 1.5rem;
    }
    .portal-box {
      max-width: 420px;
      width: 100%;
    }
    .portal-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .portal-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: rgba(99, 102, 241, 0.14);
      border: 1px solid rgba(99, 102, 241, 0.35);
      margin-bottom: 1.15rem;
    }
    .portal-badge-inner {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      background: #6366f1;
      box-shadow: 0 0 12px #6366f1;
    }
    .portal-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .portal-subtitle {
      font-size: 0.88rem;
      color: #94a3b8;
      margin-top: 0.35rem;
    }
    .portal-card {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      padding: 2rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-control {
      width: 100%;
      display: block;
      padding: 0.7rem 0.95rem;
      font-size: 0.92rem;
      border: 1px solid #1e293b;
      border-radius: 8px;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .form-control:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    select.form-control {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 0.85rem center;
      background-size: 1rem;
      padding-right: 2.5rem;
      cursor: pointer;
    }
    .btn-submit {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1rem;
      font-size: 0.92rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      background: #6366f1;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
      margin-top: 0.5rem;
    }
    .btn-submit:hover {
      background: #4f46e5;
    }
    .btn-submit:active {
      transform: scale(0.99);
    }
    .alert-box {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      border: 1px solid rgba(244, 63, 94, 0.4);
      background: rgba(244, 63, 94, 0.12);
      color: #fb7185;
    }
    .portal-footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #64748b;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <div class="portal-box">
    <!-- Header -->
    <div class="portal-header">
      <div class="portal-badge">
        <div class="portal-badge-inner"></div>
      </div>
      <h1 class="portal-title">Venture Portal</h1>
      <p class="portal-subtitle">Private Workspace for Imran &amp; Mikiyas</p>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert-box">
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Login Card -->
    <div class="portal-card">
      <div id="client-alert" class="alert-box" style="display:none;">
        <span id="client-alert-msg"></span>
      </div>

      <form id="login-form" action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
          <label class="form-label" for="partner_id">Partner Identity</label>
          <select id="partner_id" name="partner_id" class="form-control" required>
            <option value="imran">Imran</option>
            <option value="mikiyas">Mikiyas</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="pin">Access Password</label>
          <input id="pin" type="password" name="pin" class="form-control" placeholder="Enter private password" required autofocus autocomplete="current-password">
        </div>

        <button id="login-btn" type="submit" class="btn-submit">
          Authenticate &amp; Unlock Workspace
        </button>
      </form>
    </div>

    <div class="portal-footer">
      End-to-End Encrypted Session &bull; Private Venture Records
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const btn = document.getElementById('login-btn');
    const alertBox = document.getElementById('client-alert');
    const alertMsg = document.getElementById('client-alert-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      btn.disabled = true;
      btn.innerText = 'Verifying Credentials...';

      const partner_id = document.getElementById('partner_id').value;
      const pin = document.getElementById('pin').value.trim();

      try {
        const response = await fetch('{{ url_for("login") }}', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({ partner_id, pin })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          btn.innerText = 'Unlocked! Opening Workspace...';
          btn.style.background = '#10b981';
          window.location.href = data.redirect || '/';
        } else {
          btn.disabled = false;
          btn.innerText = 'Authenticate & Unlock Workspace';
          btn.style.background = '#6366f1';
          alertMsg.innerText = data.error || 'Incorrect security code. Access denied.';
          alertBox.style.display = 'block';
          document.getElementById('pin').focus();
        }
      } catch (err) {
        // Fallback to traditional form submission if fetch encounters an edge error
        form.submit();
      }
    });
  </script>
</body>
</html>
