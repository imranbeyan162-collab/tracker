<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Verification - Imran & Mikiyas Management</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background: radial-gradient(circle at 50% 20%, #151f32 0%, #080c14 100%);">

  <div style="max-width: 420px; width: 100%; padding: 1.5rem;">
    <!-- Logo & Security Header -->
    <div style="text-align:center; margin-bottom: 2rem;">
      <div style="display:inline-flex; align-items:center; justify-content:center; width:48px; height:48px; border-radius:12px; background:rgba(99, 102, 241, 0.12); border:1px solid rgba(99, 102, 241, 0.3); margin-bottom:1rem;">
        <div style="width:14px; height:14px; border-radius:3px; background:var(--accent-indigo);"></div>
      </div>
      <h1 style="font-size:1.45rem; font-weight:700; color:#ffffff; letter-spacing:-0.02em;">Venture Portal</h1>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-top:0.35rem;">Private Workspace for Imran &amp; Mikiyas</p>
    </div>

    <!-- Flash Alert -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div style="margin-bottom:1.25rem;">
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}" style="font-size:0.85rem; padding:0.65rem 1rem;">
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Gatekeeper Login Card -->
    <div class="card" style="background:#111827; border-color:#1e293b; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); padding:1.75rem;">
      <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
          <label class="form-label">Partner Identity</label>
          <select name="partner_id" class="form-select" required>
            <option value="imran">Imran</option>
            <option value="mikiyas">Mikiyas</option>
          </select>
        </div>

        <div class="form-group" style="margin-bottom:1.5rem;">
          <label class="form-label">Access Password</label>
          <input type="password" name="pin" class="form-input" placeholder="Enter private password" required autofocus>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:0.65rem 1rem; font-size:0.9rem;">
          Authenticate &amp; Unlock Workspace
        </button>
      </form>
    </div>

    <div style="text-align:center; margin-top:2rem; font-size:0.75rem; color:var(--text-subtle);">
      End-to-End Encrypted Session &bull; Private Venture Records
    </div>
  </div>

</body>
</html>
